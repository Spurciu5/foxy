<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121327">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foxy">
<title>Foxy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.54 1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.18.6.73 1 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="i-friends" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M3.2 10.6 4.6 3.4c.1-.5.7-.7 1.1-.4l4 3.1h4.6l4-3.1c.4-.3 1-.1 1.1.4l1.4 7.2c.5 1 .7 2 .7 3 0 4.6-4.1 7.4-9.5 7.4S2.5 18.2 2.5 13.6c0-1 .2-2 .7-3Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5.2" ry="4.4" fill="currentColor"/><circle cx="5.4" cy="10.4" r="2.2" fill="currentColor"/><circle cx="9.4" cy="6.6" r="2.4" fill="currentColor"/><circle cx="14.6" cy="6.6" r="2.4" fill="currentColor"/><circle cx="18.6" cy="10.4" r="2.2" fill="currentColor"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.6 2.2c.4 3.1-1 4.8-2.4 6.4C8.8 10.2 7.4 11.8 7.4 14.6A4.6 4.6 0 0 0 12 19.2a4.6 4.6 0 0 0 4.6-4.6c0-1.3-.4-2.4-1-3.4.9.3 1.7 1 2.2 1.9.5-.9.8-2 .8-3.1 0-3.7-2.6-6.5-6-7.8Z"/><path fill="#fff6d8" opacity=".85" d="M12 19.2a2.6 2.6 0 0 1-2.6-2.6c0-1.6 1.3-2.5 2.2-3.9.5 1.4 3 2.1 3 3.9a2.6 2.6 0 0 1-2.6 2.6Z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 18h3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div id="app">
  <!-- Linking this phone to a Foxy account -->
  <section id="link" class="screen hidden">
    <canvas id="linkFox" class="link-fox"></canvas>
    <h1>Foxy</h1>
    <form id="linkForm" autocomplete="off">
      <input id="codeInput" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX XXXX" aria-label="Code">
      <button id="linkBtn" class="primary" type="submit">Link</button>
      <p id="linkMsg" class="msg"></p>
    </form>
  </section>

  <!-- The app -->
  <section id="main" class="screen hidden">
    <header class="top">
      <button id="btnSettings" class="icon" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      <button id="btnBack" class="icon hidden" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <div class="title"><span id="topTitle"></span><span id="topSub"></span></div>
      <button id="btnBell" class="icon" aria-label="Notifications"><svg><use href="#i-bell"/></svg><span id="badge" class="badge hidden"></span></button>
      <button id="btnMore" class="icon hidden" aria-label="More"><svg><use href="#i-more"/></svg></button>
      <span id="topStreak" class="streak-chip hidden"><svg><use href="#i-flame"/></svg><b></b></span>
    </header>
    <div id="conn" class="conn hidden">Connecting…</div>

    <div id="stage">
      <canvas id="foxCanvas"></canvas>
      <div id="pokeArea" class="hidden">
        <div id="combo" class="combo"></div>
        <button id="pokeBtn" class="poke"><svg><use href="#i-paw"/></svg><span>Poke</span></button>
      </div>
    </div>

    <div id="friends" class="sheet">
      <div class="sheet-head"><span>Friends <span id="friendCount"></span></span><button id="btnAdd" class="icon small" aria-label="Add a friend"><svg><use href="#i-plus"/></svg></button></div>
      <div class="list">
        <form id="addCard" class="add-card hidden" autocomplete="off">
          <div class="add-row"><input id="addInput" placeholder="FOX-XXXXXX" autocapitalize="characters" spellcheck="false" maxlength="12"><button class="primary small" type="submit">Add</button></div>
          <p id="addMsg" class="add-msg"></p>
          <button type="button" id="myCode" class="my-code"><span>My code</span><b></b></button>
        </form>
        <div id="reqList"></div>
        <div id="friendList"></div>
      </div>
      <p id="noFriends" class="empty hidden">No friends yet. Add them from Foxy on your PC.</p>
    </div>

    <div id="upd" class="upd hidden"><span id="updText">New version</span><button id="updBtn">Update</button></div>

    <nav id="tabbar">
      <button id="tabBtn"><svg><use href="#i-friends"/></svg><span>Friends</span></button>
    </nav>
  </section>

  <!-- Notifications -->
  <section id="notes" class="panel">
    <header class="panel-head"><span>Notifications</span><button class="icon close" data-close="notes" aria-label="Close"><svg><use href="#i-close"/></svg></button></header>
    <div id="noteList" class="list"></div>
    <p id="noNotes" class="empty hidden">Nothing yet.</p>
  </section>

  <!-- Settings -->
  <section id="settings" class="panel left">
    <header class="panel-head"><span>Settings</span><button class="icon close" data-close="settings" aria-label="Close"><svg><use href="#i-close"/></svg></button></header>
    <div class="rows">
      <label class="row toggle"><span>Notifications</span><input id="notifyToggle" type="checkbox"><i></i></label>
      <p id="notifyNote" class="note hidden"></p>
      <div class="row"><span>Name</span><b id="meNameRow"></b></div>
      <button id="codeRow" class="row"><span>Friend code</span><b id="meCodeRow"></b></button>
      <button id="unlinkBtn" class="row danger">Unlink this phone</button>
      <p class="ver">Foxy for phone · beta</p>
    </div>
  </section>

  <div id="scrim" class="scrim"></div>
  <div id="toast" class="toast"></div>
</div>

<script src="acc.js"></script>
<script src="fox.js"></script>
<script src="app.js"></script>
</body>
</html>
