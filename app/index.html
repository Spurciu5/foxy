<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Foxy</title>
<style>html{height:100%}body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;
background:#15151f;color:#e9e9f2;font:16px/1.6 system-ui,sans-serif;text-align:center;padding:24px}</style>
</head><body><div><h1>Foxy</h1>
<p>Foxy has been discontinued and no longer works.</p>
<p>Please uninstall the app from your phone.</p></div>
<script>
try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}}catch(e){}
try{if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}}catch(e){}
</script></body></html>
